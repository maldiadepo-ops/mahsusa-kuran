<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahsusa Kur'an - Dijital Eğitim Platformu</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Modül çerçevesinin ekranı tam kaplaması için stil ayarı */
    .modul-kapsayici {
      width: 100%;
      height: calc(100vh - 73px); /* Header yüksekliği çıkarılmış tam ekran */
      border: none;
    }
  </style>
</head>
<body class="bg-slate-100 flex flex-col min-h-screen overflow-hidden">

  <!-- ================================================================= -->
  <!-- 1. SABİT ÜST GEZİNTİ MENÜSÜ (HEADER)                            -->
  <!-- ================================================================= -->
  <header class="bg-emerald-900 text-white shadow-md z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      
      <!-- Marka Logo ve Başlık -->
      <div class="flex items-center space-x-2 cursor-pointer" onclick="modulYukle('elifba')">
        <span class="text-2xl font-black tracking-wider text-amber-400">MAHSUSA</span>
        <span class="text-xl font-bold text-white">KUR'AN</span>
      </div>

      <!-- Modül Seçim Butonları -->
      <nav class="flex items-center space-x-1 md:space-x-3 text-sm font-medium">
        <button 
          id="btn-elifba" 
          onclick="modulYukle('elifba')" 
          class="px-4 py-2 rounded-xl bg-emerald-800 text-amber-300 font-bold transition">
          Elifba Eğitimi
        </button>
        
        <button 
          id="btn-yarisma" 
          onclick="modulYukle('yarisma')" 
          class="px-4 py-2 rounded-xl hover:bg-emerald-800 transition">
          Siyer Yarışması
        </button>
        
        <button 
          id="btn-paket" 
          onclick="modulYukle('paket')" 
          class="bg-amber-400 hover:bg-amber-500 text-emerald-950 font-bold px-4 py-2 rounded-xl transition">
          9'lu Özel Paket
        </button>
      </nav>

    </div>
  </header>

  <!-- ================================================================= -->
  <!-- 2. DİNAMİK MODÜL YÜKLEME ALANI (MAIN)                            -->
  <!-- ================================================================= -->
  <main class="flex-grow w-full bg-slate-100">
    <!-- İlgili modül dosyası buraya yüklenir (Varsayılan: Elifba Modülü) -->
    <iframe id="modulCerceve" src="./modules/elifba/index.html" class="modul-kapsayici"></iframe>
  </main>

  <!-- ================================================================= -->
  <!-- 3. BİRLEŞTİRME VE YÖNLENDİRME SCRIPT'İ                             -->
  <!-- ================================================================= -->
  <script>
    /**
     * Seçilen modülü ana sayfadaki çerçeveye yükler ve buton durumlarını günceller
     * @param {string} modulAdi - Yüklenecek modülün adı ('elifba', 'yarisma', 'paket')
     */
    function modulYukle(modulAdi) {
      const cerceve = document.getElementById('modulCerceve');
      
      // 1. Modül Yolunu Belirle ve İframe İçeriğini Değiştir
      if (modulAdi === 'elifba') {
        cerceve.src = './modules/elifba/index.html';
      } else if (modulAdi === 'yarisma') {
        cerceve.src = './modules/yarisma/index.html';
      } else if (modulAdi === 'paket') {
        cerceve.src = './modules/paket/index.html';
      }

      // 2. Aktif Buton Vurgusunu Güncelle
      const butonlar = ['elifba', 'yarisma', 'paket'];
      butonlar.forEach(id => {
        const btn = document.getElementById(`btn-${id}`);
        if (id === modulAdi) {
          btn.classList.add('bg-emerald-800', 'text-amber-300', 'font-bold');
        } else if (id !== 'paket') {
          btn.classList.remove('bg-emerald-800', 'text-amber-300', 'font-bold');
        }
      });
    }
  </script>
</body>
</html>
