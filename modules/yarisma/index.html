<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siyer Yarışması - Mahsusa Kur'an</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 md:p-6 min-h-screen flex items-center justify-center">

  <div class="max-w-2xl w-full mx-auto">
    <!-- EKRAN 1: SEVİYE SEÇİMİ -->
    <div id="baslangicEkrani" class="bg-white p-6 md:p-8 rounded-3xl shadow-lg border border-slate-200 text-center space-y-6">
      <div class="w-20 h-20 bg-emerald-100 text-emerald-800 rounded-full flex items-center justify-center text-4xl mx-auto">🏆</div>
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-emerald-900">Siyer ve Dini Bilgiler Yarışması</h1>
        <p class="text-slate-600 text-sm mt-2">Lütfen seviyenizi seçin. Her testte rastgele sorular sorulur.</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <button onclick="seviyeSec('kolay')" class="p-4 rounded-2xl border-2 border-amber-300 bg-amber-50 hover:bg-amber-100 text-amber-900 font-bold text-sm transition">🎈 Kolay (Çocuk)</button>
        <button onclick="seviyeSec('orta')" class="p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 font-bold text-sm transition">📖 Orta (Genel)</button>
        <button onclick="seviyeSec('zor')" class="p-4 rounded-2xl border-2 border-indigo-500 bg-indigo-50 hover:bg-indigo-100 text-indigo-900 font-bold text-sm transition">🎓 Zor (İleri)</button>
      </div>
    </div>

    <!-- EKRAN 2: SORU EKRANI -->
    <div id="soruEkrani" class="hidden bg-white p-6 md:p-8 rounded-3xl shadow-lg border border-slate-200 space-y-6">
      <div class="flex justify-between items-center border-b pb-4 text-sm font-semibold text-slate-500">
        <span id="soruSayaciText" class="text-emerald-800 font-bold">Soru 1 / 5</span>
        <span id="seviyeEtiketi" class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-bold">Orta Seviye</span>
        <span id="puanText" class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-xs font-bold">Puan: 0</span>
      </div>

      <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
        <div id="ilerlemeCubugu" class="bg-emerald-600 h-full w-0 transition-all duration-300"></div>
      </div>

      <h2 id="soruMetni" class="text-lg md:text-xl font-bold text-slate-800 leading-snug">Soru Yükleniyor...</h2>
      <div id="siklarKonteyneri" class="space-y-3"></div>
    </div>

    <!-- EKRAN 3: SONUÇ EKRANI -->
    <div id="sonucEkrani" class="hidden bg-white p-8 rounded-3xl shadow-lg border border-slate-200 text-center space-y-6">
      <div class="w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-4xl mx-auto">🎉</div>
      <h2 class="text-2xl font-extrabold text-slate-800">Tebrikler! Test Tamamlandı</h2>
      
      <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto">
        <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200">
          <span class="block text-2xl font-black text-emerald-700" id="sonucDogru">0 / 5</span>
          <span class="text-xs text-slate-500 font-semibold">Doğru Cevap</span>
        </div>
        <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200">
          <span class="block text-2xl font-black text-amber-700" id="sonucPuan">0</span>
          <span class="text-xs text-slate-500 font-semibold">Toplam Puan</span>
        </div>
      </div>

      <button onclick="ekranGoster('baslangicEkrani')" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-2xl transition">Farklı Seviye Seç / Yeniden Başla</button>
    </div>
  </div>

  <script>
    // GENİŞLETİLMİŞ SORU BANKASI
    const SORU_BANKASI = {
      kolay: [
        { soru: "Peygamber Efendimiz (s.a.v.) hangi şehirde doğmuştur?", siklar: ["Mekke", "Medine", "Taif", "Kudüs"], dogru: "Mekke" },
        { soru: "Kur'an-ı Kerim'in ilk suresi hangisidir?", siklar: ["Fatiha Suresi", "Yasin Suresi", "Ihlas Suresi", "Bakara Suresi"], dogru: "Fatiha Suresi" },
        { soru: "Peygamberimizin annesinin adı nedir?", siklar: ["Hz. Amine", "Hz. Hatice", "Hz. Fatıma", "Hz. Halime"], dogru: "Hz. Amine" },
        { soru: "Islam'ın şartı kaçtır?", siklar: ["5", "6", "4", "3"], dogru: "5" },
        { soru: "Peygamberimize verilen 'Güvenilir' anlamındaki lakap hangisidir?", siklar: ["El-Emin", "El-Faruk", "El-Sıddık", "El-Hayr"], dogru: "El-Emin" },
        { soru: "Peygamberimizin babasının adı nedir?", siklar: ["Abdullah", "Ebu Talip", "Abdulmuttalib", "Hamza"], dogru: "Abdullah" },
        { soru: "Peygamberimizin dedesinin adı nedir?", siklar: ["Abdulmuttalib", "Ebu Talip", "Abdumanaf", "Haşim"], dogru: "Abdulmuttalib" },
        { soru: "Peygamberimize sütannelik yapan mübarek hanım kimdir?", siklar: ["Hz. Halime", "Hz. Amine", "Hz. Sümeyye", "Hz. Sevde"], dogru: "Hz. Halime" }
      ],
      orta: [
        { soru: "Kur'an-ı Kerim'in ilk inen ayetleri hangi surededir?", siklar: ["Alak Suresi", "Müddeşşir Suresi", "Fatiha Suresi", "Kadir Suresi"], dogru: "Alak Suresi" },
        { soru: "Mekke'den Medine'ye yapılan tarihi göçe ne ad verilir?", siklar: ["Hicret", "Miraç", "Mevlit", "Rihlet"], dogru: "Hicret" },
        { soru: "İlk kadın Müslüman kimdir?", siklar: ["Hz. Hatice (r.a.)", "Hz. Aişe (r.a.)", "Hz. Fatıma (r.a.)", "Hz. Sümeyye (r.a.)"], dogru: "Hz. Hatice (r.a.)" },
        { soru: "Peygamber Efendimize ilk vahiy hangi mağarada gelmiştir?", siklar: ["Hira Mağarası", "Sevr Mağarası", "Uhud Mağarası", "Nur Mağarası"], dogru: "Hira Mağarası" },
        { soru: "Kur'an-ı Kerim hangi halife döneminde kitap (mushaf) haline getirilmiştir?", siklar: ["Hz. Ebu Bekir (r.a.)", "Hz. Ömer (r.a.)", "Hz. Osman (r.a.)", "Hz. Ali (r.a.)"], dogru: "Hz. Ebu Bekir (r.a.)" },
        { soru: "Müslümanların ilk kıblesi neresidir?", siklar: ["Mescid-i Aksa", "Kabe", "Mescid-i Nebevi", "Mescid-i Kuba"], dogru: "Mescid-i Aksa" },
        { soru: "İlk erkek Müslüman kimdir?", siklar: ["Hz. Ebu Bekir (r.a.)", "Hz. Ali (r.a.)", "Hz. Ömer (r.a.)", "Hz. Zeyd (r.a.)"], dogru: "Hz. Ebu Bekir (r.a.)" },
        { soru: "Peygamberimizin amcası ve 'Allah'ın Arslanı' olarak anılan sahabi kimdir?", siklar: ["Hz. Hamza (r.a.)", "Hz. Abbas (r.a.)", "Hz. Cafer (r.a.)", "Hz. Ebu Talip"], dogru: "Hz. Hamza (r.a.)" }
      ],
      zor: [
        { soru: "Peygamber Efendimizin (s.a.v.) katıldığı ilk gazve hangisidir?", siklar: ["Ebva (Weddan) Gazvesi", "Bedir Gazvesi", "Uhud Gazvesi", "Hendek Gazvesi"], dogru: "Ebva (Weddan) Gazvesi" },
        { soru: "Kur'an-ı Kerim'i çoğaltma kurulu başkanlığı yapan sahabi kimdir?", siklar: ["Zeyd bin Sabit (r.a.)", "Muaz bin Cebel (r.a.)", "Ubeyy bin Ka'b (r.a.)", "Abdullah bin Mes'ud (r.a.)"], dogru: "Zeyd bin Sabit (r.a.)" },
        { soru: "Medine'de inşa edilen ilk mescid hangisidir?", siklar: ["Kuba Mescidi", "Mescid-i Nebevi", "Mescid-i Kıbleteyn", "Mescid-i Cuma"], dogru: "Kuba Mescidi" },
        { soru: "Hudeybiye Antlaşması hangi yılda imzalanmıştır?", siklar: ["Hicretin 6. Yılı", "Hicretin 8. Yılı", "Hicretin 5. Yılı", "Hicretin 10. Yılı"], dogru: "Hicretin 6. Yılı" },
        { soru: "Kur'an-ı Kerim'in en uzun suresi hangisidir?", siklar: ["Bakara Suresi", "Ali Imran Suresi", "Nisa Suresi", "Maide Suresi"], dogru: "Bakara Suresi" },
        { soru: "Peygamberimizin kabrinin bulunduğu yere ne ad verilir?", siklar: ["Riyazul Cenne / Hücre-i Saadet", "Mevlit Binası", "Cennetul Baki", "Mescid-i Kuba"], dogru: "Riyazul Cenne / Hücre-i Saadet" }
      ]
    };

    let aktifSorular = [], mevcutSoruIndex = 0, toplamPuan = 0, dogruSayisi = 0, tiklamaKilitli = false;

    function karistir(dizi) {
      const yeni = [...dizi];
      for (let i = yeni.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [yeni[i], yeni[j]] = [yeni[j], yeni[i]];
      }
      return yeni;
    }

    function seviyeSec(seviye) {
      const ham = SORU_BANKASI[seviye] || SORU_BANKASI.orta;
      aktifSorular = karistir(ham).slice(0, 5); // 5 Rastgele soru seç
      mevcutSoruIndex = 0; toplamPuan = 0; dogruSayisi = 0;

      document.getElementById('seviyeEtiketi').innerText = { kolay: 'Kolay (Çocuk)', orta: 'Orta Seviye', zor: 'Zor (İleri)' }[seviye];
      ekranGoster('soruEkrani');
      soruyuYukle();
    }

    function ekranGoster(id) {
      ['baslangicEkrani', 'soruEkrani', 'sonucEkrani'].forEach(e => document.getElementById(e).classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function soruyuYukle() {
      tiklamaKilitli = false;
      const s = aktifSorular[mevcutSoruIndex];
      document.getElementById('soruSayaciText').innerText = `Soru ${mevcutSoruIndex + 1} / ${aktifSorular.length}`;
      document.getElementById('puanText').innerText = `Puan: ${toplamPuan}`;
      document.getElementById('ilerlemeCubugu').style.width = `${((mevcutSoruIndex + 1) / aktifSorular.length) * 100}%`;
      document.getElementById('soruMetni').innerText = s.soru;

      const siklar = karistir(s.siklar);
      const k = document.getElementById('siklarKonteyneri');
      k.innerHTML = '';

      siklar.forEach((m, i) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-emerald-50 hover:border-emerald-300 transition font-medium text-slate-700 flex justify-between items-center";
        btn.innerHTML = `<span>${m}</span><span class="w-6 h-6 rounded-full border flex items-center justify-center text-xs font-bold text-slate-400">${String.fromCharCode(65 + i)}</span>`;
        btn.onclick = () => cevapKontrolEt(m, s.dogru, btn);
        k.appendChild(btn);
      });
    }

    function cevapKontrolEt(secilen, dogru, btn) {
      if (tiklamaKilitli) return;
      tiklamaKilitli = true;
      const tum = document.getElementById('siklarKonteyneri').children;

      if (secilen === dogru) {
        btn.className = "w-full text-left p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-100 text-emerald-900 font-bold flex justify-between items-center";
        toplamPuan += 20; dogruSayisi++;
      } else {
        btn.className = "w-full text-left p-4 rounded-2xl border-2 border-red-500 bg-red-100 text-red-900 font-bold flex justify-between items-center";
        Array.from(tum).forEach(b => { if (b.innerText.includes(dogru)) b.className = "w-full text-left p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold flex justify-between items-center"; });
      }

      setTimeout(() => {
        mevcutSoruIndex++;
        if (mevcutSoruIndex < aktifSorular.length) soruyuYukle();
        else yarisimayiBitir();
      }, 1200);
    }

    function yarisimayiBitir() {
      ekranGoster('sonucEkrani');
      document.getElementById('sonucDogru').innerText = `${dogruSayisi} / ${aktifSorular.length}`;
      document.getElementById('sonucPuan').innerText = toplamPuan;
    }
  </script>
</body>
</html>
