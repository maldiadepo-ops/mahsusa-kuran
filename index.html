<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AÇIK. - Mahsusa Kur'an</title>
    <style>
        :root[data-theme="dark"] {
            --bg-body: #0d0f12;
            --card-bg: rgba(22, 25, 32, 0.95);
            --modal-bg: #181b22;
            --input-bg: #1e222b;
            --border-color: #2a2f3d;
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --arabic-size: 1.8rem;
            --translation-size: 1.05rem;
            --hero-image: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(13,15,18,0.95)), 
                          url('https://images.unsplash.com/photo-1511497584788-8767610419ea?q=80&w=1600&auto=format&fit=crop');
        }

        :root[data-theme="light"] {
            --bg-body: #e2e8f0;
            --card-bg: #ffffff;
            --modal-bg: #ffffff;
            --input-bg: #f8fafc;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-red: #dc2626;
            --accent-green: #0d9488;
            --arabic-size: 1.8rem;
            --translation-size: 1.05rem;
            --hero-image: linear-gradient(to bottom, rgba(255,255,255,0.2), rgba(226,232,240,0.95)), 
                          url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1600&auto=format&fit=crop');
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem 1rem 5rem 1rem;
            transition: background 0.3s ease;
        }

        .hero-card {
            width: 100%; max-width: 950px; height: 280px; border-radius: 14px;
            background: var(--hero-image); background-size: cover; background-position: center;
            padding: 1.5rem 2rem; display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color);
        }

        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: 900; letter-spacing: 1px; color: #ffffff; }
        .nav-actions { display: flex; align-items: center; gap: 1.2rem; }

        .nav-btn {
            background: transparent; border: none; color: #d1d5db; cursor: pointer;
            padding: 4px; position: relative; display: flex; align-items: center; transition: color 0.2s;
        }
        .nav-btn:hover { color: #ffffff; }

        .last-read-banner {
            display: none; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green);
            color: #ffffff; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px;
            cursor: pointer; align-self: center; margin-bottom: 0.5rem; transition: background 0.2s;
        }
        .last-read-banner:hover { background: rgba(16, 185, 129, 0.3); }

        .search-wrapper { display: flex; justify-content: center; width: 100%; margin-bottom: 0.5rem; }
        .search-box {
            width: 100%; max-width: 680px; background-color: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 0.75rem 1.2rem;
            display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
        }

        .search-input { background: transparent; border: none; outline: none; color: var(--text-main); font-size: 0.95rem; width: 100%; }

        .results-container { width: 100%; max-width: 950px; margin-top: 1.5rem; display: none; flex-direction: column; gap: 1.2rem; }
        .results-container.show { display: flex; }
        .results-header { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.9rem; padding: 0 0.5rem; }

        .verse-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
            cursor: pointer;
        }

        .verse-card.playing-active {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.35) !important;
            transform: scale(1.01);
            transition: all 0.4s ease;
        }

        .verse-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: 700; color: var(--accent-green); }
        .verse-meta .author { color: var(--text-muted); font-weight: 400; font-style: italic; margin-left: 0.4rem; }
        
        .verse-translation { font-size: var(--translation-size); line-height: 1.6; }
        .verse-arabic { font-size: var(--arabic-size); text-align: right; direction: rtl; font-family: serif; line-height: 2; }
        .verse-transliteration { font-size: 0.95rem; color: #f59e0b; }

        /* KELİME KELİME MEAL STİLLERİ */
        .words-wrapper {
            display: flex; flex-wrap: wrap; gap: 0.6rem; direction: rtl;
            background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 0.8rem; margin-top: 0.5rem;
        }
        .word-chip {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #12141a; border: 1px solid var(--border-color);
            padding: 0.4rem 0.6rem; border-radius: 6px; min-width: 60px;
        }
        .word-arabic { font-size: 1.2rem; font-family: serif; color: var(--text-main); }
        .word-meaning { font-size: 0.75rem; color: var(--accent-green); margin-top: 0.2rem; text-align: center; direction: ltr; }

        .bottom-player {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(18, 22, 29, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            padding: 0.8rem 1.5rem; display: none; justify-content: space-between;
            align-items: center; z-index: 2000; box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
            flex-wrap: wrap; gap: 0.5rem;
        }
        .bottom-player.active { display: flex; }
        .player-info { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
        .player-controls { display: flex; align-items: center; gap: 0.8rem; }
        .player-btn { background: transparent; border: none; color: #fff; cursor: pointer; font-size: 1.2rem; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--modal-bg); border: 1px solid var(--border-color);
            border-radius: 12px; width: 90%; max-width: 550px; max-height: 80vh;
            padding: 1.5rem; display: flex; flex-direction: column; gap: 1.2rem; color: #ffffff;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.8rem; }
        .tab-nav { display: flex; gap: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.8rem; }
        .tab-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.95rem; font-weight: 600; padding: 0.4rem 0.8rem; border-radius: 6px; }
        .tab-btn.active { background: rgba(255, 255, 255, 0.08); color: #ffffff; }

        .tab-pane { display: none; flex-direction: column; gap: 1.2rem; }
        .tab-pane.active { display: flex; }

        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-input { background: #101216; border: 1px solid var(--border-color); border-radius: 6px; padding: 0.6rem; color: #fff; outline: none; }
        .btn-turquoise { background-color: var(--accent-green); color: #ffffff; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .surah-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.8rem; overflow-y: auto; max-height: 60vh; padding-right: 0.4rem;
        }
        .surah-card-item {
            background: #101216; border: 1px solid var(--border-color);
            padding: 0.8rem; border-radius: 8px; cursor: pointer; transition: border-color 0.2s;
        }
        .surah-card-item:hover { border-color: var(--accent-green); }

        select.filter-select {
            background-color: rgba(255, 255, 255, 0.08); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 0.35rem 0.6rem;
            border-radius: 6px; font-size: 0.85rem; outline: none; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- HERO PANEL -->
    <header class="hero-card">
        <div class="top-bar">
            <div class="logo">AÇIK.</div>
            <nav class="nav-actions">
                <button class="nav-btn" onclick="openModal('modal-settings')" title="Ayarlar ve Profil">
                    <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
                </button>                
                <button class="nav-btn" onclick="openModal('modal-bookmarks')" title="Yer İşaretleri">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                </button>                
                <button class="nav-btn active" id="btn-theme-toggle" title="Tema Değiştir">
                    <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </nav>
        </div>

        <div class="last-read-banner" id="last-read-banner"></div>

        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="main-search-input" class="search-input" placeholder="Ara... (Örn: Sabır, Rahmet, İhlas)">
                <div class="search-icons">
                    <button class="nav-btn" id="btn-cuz" title="114 Sure Listesi">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ARAMA SONUÇLARI -->
    <section class="results-container" id="results-container">
        <div class="results-header">
            <span>Arama Sonuçları</span>
            <span id="results-count">0 ayet bulundu</span>
        </div>
        <div id="verse-list"></div>
    </section>

    <!-- SABİT ALT SES OYNATICI BARI -->
    <div class="bottom-player" id="bottom-audio-player">
        <div class="player-info" id="player-info-text">1. Sure / 1. Ayet</div>
        
        <div class="player-controls">
            <select class="filter-select" title="Dinleme Hızı" onchange="setAudioSpeed(this.value)">
                <option value="0.75">0.75x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
            </select>

            <select class="filter-select" title="Ayet Tekrar Sayısı" onchange="setVerseRepeatLimit(this.value)">
                <option value="1" selected>1x Tekrar</option>
                <option value="3">3x Tekrar</option>
                <option value="5">5x Tekrar</option>
                <option value="999">Sonsuz Döngü</option>
            </select>

            <button class="player-btn" onclick="handlePrevVerse()" title="Önceki Ayet">⏮️</button>
            <button class="player-btn" id="player-btn-play" onclick="handlePlayPauseClick()" title="Oynat / Durdur">▶️</button>
            <button class="player-btn" onclick="handleNextVerse()" title="Sonraki Ayet">⏭️</button>
            <button class="player-btn" onclick="handleClosePlayer()" title="Kapat" style="margin-left:0.5rem; color: var(--text-muted);">✕</button>
        </div>
    </div>

    <!-- 114 SURE LİSTESİ MODALI -->
    <div class="modal-overlay" id="modal-surah-list">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Sure Listesi (114 Sure)</h3>
                <button class="nav-btn" onclick="closeModal('modal-surah-list')">✕</button>
            </div>
            <input type="text" class="form-input" placeholder="Sure ara..." oninput="filterSurahList(this.value)">
            <div class="surah-grid" id="surah-grid-container"></div>
        </div>
    </div>

    <!-- KİŞİSEL NOT YAZMA MODALI -->
    <div class="modal-overlay" id="modal-verse-note">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="note-modal-title">Ayet Notu</h3>
                <button class="nav-btn" onclick="closeModal('modal-verse-note')">✕</button>
            </div>
            <div class="form-group">
                <label style="font-size:0.85rem; color:var(--text-muted);">Bu ayet için kişisel ders ve çalışma notlarınız:</label>
                <textarea id="note-modal-input" class="form-input" rows="5" placeholder="Notunuzu yazın..."></textarea>
            </div>
            <button class="btn-turquoise" onclick="saveCurrentVerseNote()">Notu Kaydet</button>
        </div>
    </div>

    <!-- AYARLAR & PROFİL MODALI -->
    <div class="modal-overlay" id="modal-settings">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Kullanıcı Paneli</h3>
                <button class="nav-btn" onclick="closeModal('modal-settings')">✕</button>
            </div>
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('tab-settings', this)">⚙️ Ayarlar</button>
                <button class="tab-btn" onclick="switchTab('tab-profile', this)">👤 Profil</button>
                <button class="tab-btn" onclick="switchTab('tab-history', this)">🕒 Geçmiş</button>
                <button class="tab-btn" onclick="switchTab('tab-notes', this)">📝 Notlarım</button>
            </div>
            
            <div class="tab-pane active" id="tab-settings">
                <div class="form-group">
                    <label style="font-size:0.85rem; color:var(--text-muted);">Okuyucu (Hafız)</label>
                    <select class="filter-select" id="select-reciter" onchange="setSelectedReciter(this.value)">
                        <option value="alafasy">Mişari el-Afasi</option>
                        <option value="abdulbaset">Abdulbaset Abdussamed</option>
                        <option value="ghamadi">Saad el-Ghamadi</option>
                        <option value="minshawi">Muhammed Siddik el-Minşavi</option>
                    </select>
                </div>

                <div class="form-group" style="margin-top:0.5rem;">
                    <label style="font-size:0.85rem; color:var(--text-muted);">Arapça Font Boyutu</label>
                    <input type="range" id="slider-arabic-font" min="1.2" max="3.0" step="0.1" value="1.8" oninput="updateArabicFontSize(this.value)">
                </div>

                <div class="form-group" style="margin-top:0.5rem;">
                    <label style="font-size:0.85rem; color:var(--text-muted);">Meal Font Boyutu</label>
                    <input type="range" id="slider-trans-font" min="0.8" max="1.8" step="0.05" value="1.05" oninput="updateTranslationFontSize(this.value)">
                </div>
            </div>

            <div class="tab-pane" id="tab-profile">
                <div class="form-group"><label>İsim</label><input type="text" id="profile-name" class="form-input" value="Eyyüb YAPICI"></div>
                <div class="form-group"><label>Şehir</label><input type="text" id="profile-city" class="form-input" value="Malatya"></div>
                <button class="btn-turquoise" onclick="saveProfile()">Kaydet</button>
            </div>

            <div class="tab-pane" id="tab-history">
                <div style="background:#101216; padding:1rem; border-radius:8px; border:1px solid var(--border-color);">
                    <div style="font-size:0.85rem; color:var(--accent-green); font-weight:700;">Son Okunan Ayet:</div>
                    <div id="history-last-verse" style="font-size:0.95rem; margin-top:0.4rem; color:var(--text-main);">Henüz bir ayet okunmadı.</div>
                </div>

                <div style="background:#101216; padding:1rem; border-radius:8px; border:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.9rem; color:var(--text-muted);">Toplam Okuma Süresi:</span>
                    <span id="history-total-time" style="font-weight:700; color:#f59e0b; font-size:1.1rem;">20 Saniye</span>
                </div>
            </div>

            <div class="tab-pane" id="tab-notes">
                <div id="notes-tab-list" style="display:flex; flex-direction:column; gap:0.8rem; max-height:50vh; overflow-y:auto;"></div>
            </div>
        </div>
    </div>

    <!-- YER İŞARETLERİ MODALI -->
    <div class="modal-overlay" id="modal-bookmarks">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Yer İşaretleri</h3>
                <button class="nav-btn" onclick="closeModal('modal-bookmarks')">✕</button>
            </div>
            <div id="bookmarks-list"></div>
        </div>
    </div>

    <!-- DIPNOT MODALI -->
    <div class="modal-overlay" id="modal-footnote">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Ayet Açıklaması</h3>
                <button class="nav-btn" onclick="closeModal('modal-footnote')">✕</button>
            </div>
            <div id="footnote-modal-content"></div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="app.js"></script>
    <link rel="manifest" href="manifest.json">
</body>
</html>
